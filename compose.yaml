# Runs PostgreSQL 18 for local development and tests: `docker compose up -d`.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 keeps its data under /var/lib/postgresql (not .../data).
      - postgres-data:/var/lib/postgresql
      # Runs once, when the volume is first created.
      - ./docker/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro

volumes:
  postgres-data:
